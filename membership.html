
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capgemini Online Membership</title>
    <link rel="icon" href="images\capgemini.png">

    <style>
        form{
            background-color: antiquewhite;
        }
        h1{
            color: blueviolet;
        }
        h2{
            color: rgb(169, 34, 86);
        }
        div button:hover{
            background-color: rgb(225, 20, 78);
            color: rgb(11, 51, 125);
        }
        button{
            color: hotpink;
            background-color: rgb(39, 11, 194);
        }
    </style>
</head>
<body>
    <form action="successful.html">
        <header>
            <h1 align="center">Library Membership Registration</h1>
        </header>
        
        <h2>Membership Registration Form</h2>
        
        <label for="EmployeeName">Employee Name:</label>
        <input type="name" 
                name="EmployeeName" 
                id="EmployeeName" 
                placeholder="Enter Employee name"> <br><br>

        <label for="EmployeeID">Employee ID:</label>
        <input type="tel" 
                name="EmployeeID" 
                id="EmployeeID" 
                maxlength="8"
                placeholder="Enter ID" required> <br><br>
        
        <label for="Email">Email:</label>
        <input type="email" name="email" id="email" placeholder="abc123@gmail.com" required><br><br>

        <label for="membership">Membership Type:</label><br>
        <input type="radio" name="membership" id="membership">Fresher <br>
        <input type="radio" name="membership" id="membership">Experienced <br><br>

        <label for="Contact">Contact:</label>
        <input type="tel" 
            name="Contact" 
            id="Contact"
            placeholder="Contact Num"
            maxlength="10"><br><br>

        <label for="interestedtopics">interested topics:</label><br>
        <input type="checkbox" name="interestedtopics" id="interestedtopics">HTML <br>
        <input type="checkbox" name="interestedtopics" id="interestedtopics">CSS <br>
        <input type="checkbox" name="interestedtopics" id="interestedtopics">JS <br><br>
        
        <label for="Address">Address:</label><br>
        <textarea rows="3" cols="30" id="address"></textarea><br><br>

        <label for="data">Membership Start Date</label>
        <input type="date" name="date" id="date"><br> <br>
        
        <div align="center">
            <button type="submit">Submit</button>
        </div>
        <br>
        <hr>
        
    </form>
        <footer align="center">
            <p>@ 2026 Capgemini Online Library Management</p>
        </footer>

    
</body>
</html>
