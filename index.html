<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images\capgemini.png">
    <title>Capgemini Online Library - Login</title>

    <style>
        body{
            background-color: antiquewhite;
        }
        form{
            background-color: rgb(223, 138, 11);
        }
    </style>
</head>
<body>
    <header align="center">
        <h1>Capgemini Online Library Management System</h1>
        <p>Access Knowledge, Enhance Skills</p>
    </header>

    <hr> 
    <form action="dashboard.html">
        <main>
            <section align="center">
                <h2>Employee Login</h2>
                <label for="EmployeeName">Employee Name:</label>
                <input  type="text" 
                        name="EmployeeName"
                        id="EmployeeName"
                        placeholder="Enter Employee Name"
                        required><br><br>

                <label for="EmployeeID">Employee ID:</label>
                <input  type="tel" 
                        maxlength="8" 
                        name="EmployeeID"
                        id="EmployeeID"
                        placeholder="Enter Employee ID"
                        required><br><br>
                
                <label for="Email">Email:</label>
                <input  type="email" 
                        name="email"
                        id="email"
                        placeholder="abc@gmail.com" 
                        required><br><br>
                
                <label for="password">Password:</label>
                <input  type="password" 
                        name="password"
                        id="password"
                        placeholder="Enter Password"
                        required><br><br>
                
                <label for="Remember"></label>
                <input  type="checkbox" 
                        name="Remember"
                        id="Remember">Remember Me   <br><br> 

                <label> 
                    <button type="submit" id="login" name="Login">Login</button>
                    <button type="reset" id="reset" name="reset">Reset</button>

                </label>
            </section>
        </main>

        <hr>
    </form>
    
        <footer align="center">
            <p>@ 2026 Capgemini Online Library Management</p>
        </footer>


</body>
</html>
